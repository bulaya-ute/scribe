server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WASM + ONNX + worker assets must carry exact MIME types or the browser
    # refuses to instantiate them (wasm needs application/wasm).
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json;
        application/wasm          wasm;
        application/octet-stream  onnx;
        font/woff2                woff2;
        image/svg+xml             svg;
        text/markdown             md;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # NOTE: nginx does not inherit add_header into a location that declares its
    # own — so every block below repeats the security headers deliberately.

    # No caching for the shell so a rebuild is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # Big, content-addressed or version-pinned assets: cache hard.
    location ~ ^/(assets|models|ffmpeg|ort|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
